# Runs the production image locally: `docker compose up --build`, then http://localhost:3000
# Dokploy doesn't need this file (deploy the Dockerfile as an Application, see README).
services:
  web:
    build: .
    image: loicortola/website
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
